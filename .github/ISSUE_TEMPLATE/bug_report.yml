name: Bug report
description: Something in the Nexus Studio early-access preview did not work
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Nexus Studio open Help, then About, then Copy diagnostics, and paste the result here.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
